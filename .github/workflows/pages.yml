# main 에 푸시되면 테스트 후 dist/ 를 GitHub Pages 로 배포한다.
# 처음 한 번: Settings → Pages → Source 를 "GitHub Actions" 로 지정해야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # environment(github-pages) 를 두지 않는다: 그 환경의 배포 허용 브랜치 규칙이
  # 처음 Pages 를 켤 때의 기본 브랜치로 고정돼 main 배포를 막았기 때문
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
